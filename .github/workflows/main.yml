name: Deploy to S3

on:
  push:
    branches:
      - main # Triggers the workflow on every push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: quality-aws-s3

    steps:
      # Step 1: Download the source code from GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # Step 3: Install dependencies and build production files
      - name: Install & Build
        run: |
          npm ci --legacy-peer-deps
          CI=false npm run build

      # Step 4: Authenticate securely with AWS using OpenID Connect (OIDC) or Keys
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1 # Change to your target region

      # Step 5: Sync the built static assets to the S3 Bucket
      - name: Deploy to S3
        run: |
          aws s3 sync ./dist s3://${{ secrets.AWS_S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
